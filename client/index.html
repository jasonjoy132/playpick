<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="함께할 인원·플랫폼·장르로 나에게 맞는 게임을 찾는 플레이픽" />
    <title>플레이픽 PlayPick · 맞춤형 게임 큐레이션</title>
    <!-- 아이콘: favicon.ico는 즐겨찾기·옛 브라우저가 기본으로 찾음, SVG는 지원하는 브라우저용 -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- 메신저·SNS 공유 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="플레이픽 PlayPick" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="플레이픽 PlayPick · 친구들과 같이 할 게임 찾기" />
    <meta property="og:description" content="인원·플랫폼·장르만 고르면 같이 하기 좋은 게임을 찾아 드려요." />
    <meta property="og:url" content="https://playpick-sooty.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <script>
      // 다크 모드: 그리기 전에 정해서 깜빡임 방지 (저장한 값 → 없으면 기기 설정)
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 홈 배경 트레일러가 빨리 뜨게 미리 연결 -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
